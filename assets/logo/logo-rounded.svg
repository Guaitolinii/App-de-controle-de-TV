<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Logo do app: versão com cantos arredondados (favicon e PWA) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d29"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb4b6b"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <clipPath id="round"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Brilho vermelho atrás da TV -->
  <circle cx="512" cy="540" r="430" fill="url(#glow)"/>
  <!-- Ondas de Wi-Fi saindo do topo da TV -->
  <path d="M437.8 262.8 A105 105 0 0 1 586.2 262.8" fill="none" stroke="#f4f4f5" stroke-width="34" stroke-linecap="round"/>
  <path d="M473.1 298.1 A55 55 0 0 1 550.9 298.1" fill="none" stroke="#f4f4f5" stroke-width="34" stroke-linecap="round"/>
  <!-- Tela da TV -->
  <rect x="200" y="357" width="624" height="380" rx="80" fill="#0c0c13" stroke="url(#red)" stroke-width="44"/>
  <!-- Base da TV -->
  <rect x="417" y="771" width="190" height="38" rx="19" fill="url(#red)"/>
  <!-- Direcional do controle (anel) -->
  <circle cx="512" cy="547" r="112" fill="none" stroke="#f4f4f5" stroke-width="50"/>
  <!-- Setas do direcional -->
  <g fill="#0c0c13">
    <path d="M512 421 L528 446 L496 446 Z"/>
    <path d="M512 673 L528 648 L496 648 Z"/>
    <path d="M386 547 L411 531 L411 563 Z"/>
    <path d="M638 547 L613 531 L613 563 Z"/>
  </g>
  <!-- Botão OK -->
  <circle cx="512" cy="547" r="46" fill="url(#red)"/>
  </g>
</svg>
